services:
  redakt:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      - REDAKT_BASE_DIR=/app/src/redakt
      - REDAKT_PRESIDIO_ANALYZER_URL=http://presidio-analyzer:5001
      - REDAKT_PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:5001
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy

  presidio-analyzer:
    # SDD-007 REQ-005: built from Dockerfile.multi against the
    # MultiNlpEngine config. English requests run through spaCy
    # `en_core_web_lg`; German requests run through the
    # `xlm-roberta-large-finetuned-conll03-german` transformer.
    build:
      context: ./presidio/presidio-analyzer
      dockerfile: Dockerfile.multi
      args:
        - NLP_CONF_FILE=presidio_analyzer/conf/multi.yaml
    environment:
      - PORT=5001
    healthcheck:
      # REQ-005a Behavior B (connection-refused while engine loads). The
      # Presidio analyzer's Flask server only binds AFTER
      # `MultiNlpEngine.load()` completes for both en and de — until then,
      # `curl` exits non-zero and compose interprets that as "not ready,
      # keep retrying."
      #
      # SDD-007 4e F-D: `start_period: 30s` adopts REQ-014's formula
      # `max(30s, ceil(2 × measured_cold_start_seconds))` — measured cold
      # start was 9s, formula yields max(30, 18) = 30s. The chunk-1B
      # placeholder was 90s; that is now retired in favor of the
      # measurement-driven value. `retries: 20 × interval: 15s = 5min` of
      # post-start_period headroom remains in case a colder-cache
      # production environment exceeds the 2× margin.
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  presidio-anonymizer:
    build:
      context: ./presidio/presidio-anonymizer
    environment:
      - PORT=5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
