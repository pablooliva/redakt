[project]
name = "redakt"
version = "0.1.0"
description = "Enterprise PII detection and anonymization API wrapping Microsoft Presidio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "lingua-language-detector>=2.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.7",
    "pdfminer.six>=20231228",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "striprtf>=0.0.26",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-playwright>=0.7",
    "httpx>=0.28",
    "ruff>=0.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redakt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# E2E and eval tests are excluded by default — they need Presidio running.
# Run E2E:        uv run pytest tests/e2e/
# Run eval suite: uv run pytest tests/eval/
addopts = "--ignore=tests/e2e --ignore=tests/eval"

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "pytest-asyncio>=0.25,<1.0",
    "pytest-playwright>=0.7.2",
]
