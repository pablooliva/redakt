# === SDD-007 REQ-009b: held-out positive + long-document anchor ===
# Per Amendment 2026-05-06 (Option A): DE DATE_TIME positive dropped (xlm-
# roberta CoNLL-03 has no DATE label; DE DATE_TIME is regex-only via
# DateRecognizer at 0.6/0.8 ceiling — model-design limitation). Two
# held-out positives remain: a DE LOCATION sentence-context fixture (the
# only fixture exercised by REQ-006 Bar 2 — `must contain LOCATION`) and a
# >500-token German long-document anchor (PERF-001 / EDGE-006).

- text: "Sie wohnt in Berlin und arbeitet in München."
  language: de
  expect: [LOCATION]
  notes: "REQ-009b DE LOCATION held-out positive. Anchors REQ-006 Bar 2 (must contain LOCATION). xlm-roberta produces LOC for both Berlin and München at high score; harness asserts presence."

# EDGE-001 code-switched fixture (SDD-007 4e F-M). Mixed German + English
# in one sentence. lingua-py is bypassed by the explicit `language: de`,
# so this exercises the de transformer pipeline end-to-end against
# foreign-vocab spans that may stress the xlm-roberta tokenizer. The
# spec's EDGE-001 disposition is "no test coverage required beyond
# non-crash"; the fixture's `language: de` + `expect_clean: false` +
# `expect: [LOCATION]` both proves non-crash AND asserts the German
# LOCATION (München) is found despite the English company-name span.
- text: "Anna Smith works in München für die Beispiel GmbH."
  language: de
  expect: [LOCATION]
  notes: "EDGE-001 code-switched non-crash + DE LOCATION held. English subject + German place + German company suffix. Asserts the de transformer pipeline tokenizes mixed text without raising AND extracts München. PERSON detection on Anna Smith is not asserted (CoNLL-03 German is conservative on English-style names)."

