# Redakt runtime configuration.
#
# Tunable policy and thresholds live here, committed to git so policy
# changes are visible in code review and consistent across deployments.
#
# Precedence (highest wins):
#   1. Per-request body params on /api/detect, /api/anonymize
#   2. Environment variables (REDAKT_*, optionally loaded from .env)
#   3. This file (config.yaml)
#   4. Hard-coded defaults in src/redakt/config.py
#
# Override the file path with REDAKT_CONFIG_FILE=/path/to/other.yaml.
# Override individual values per instance via REDAKT_* env vars.

# --- Detection sensitivity ---
default_score_threshold: 0.35

# Per-entity floors applied as a post-filter on Presidio scores.
# A floor > 1.0 is the "never fire" knob — used to disable an entity
# entirely. Operator policy decisions are documented in the comments
# alongside each entry.
entity_score_thresholds:
  # Generic city + relative date over-fire at the 0.35 default; raise
  # both so "Munich today" / "next weekend" stop registering as PII.
  LOCATION: 0.90
  DATE_TIME: 0.95

  # ORGANIZATION disabled: legal entities (GmbH/UG/GbR/KG), brand
  # names, and product SKUs are NOT PII under our rules. Only natural
  # persons + identifiers redact. (See pilot results in
  # tools/memodo_pilot.py for the rationale.)
  ORGANIZATION: 1.01

  # URL recognizer fires at 0.50 on email-domain fragments (e.g.
  # `solarprofi-mueller.de` extracted from a full email address).
  # Real URLs with `https://` score 0.60. The 0.55 floor cleanly
  # separates the two without losing real URLs.
  URL: 0.55

  # DE_FUEHRERSCHEIN regex `[A-Z]{2}\d{8}[A-Z0-9]` matches any 11-char
  # 2-letter+9-alphanum sequence — including DE-prefixed VAT IDs like
  # `DE123456789`. The recognizer already declares context words
  # ("Führerschein", "Fahrerlaubnis", etc.) which boost real matches
  # to ~0.70 while bare-pattern hits stay at the 0.35 base. The 0.5
  # floor separates the two: real Führerschein numbers in context
  # pass; spurious matches on DE\d{9} VAT IDs are dropped (DE_VAT_ID
  # at score 0.85 still fires correctly on those spans).
  DE_FUEHRERSCHEIN: 0.5

# --- Language ---
default_language: auto
supported_languages: [en, de]
language_detection_timeout: 2.0
language_detection_fallback: en

# --- Allow list (instance-wide; merged with per-request terms) ---
# Strings here are filtered out of all detection results post-Presidio.
allow_list: []

# --- Limits ---
max_text_length: 512000          # ~500 KB
presidio_timeout: 30.0
max_file_size: 10485760          # 10 MB
max_zip_uncompressed_size: 104857600  # 100 MB
max_concurrent_uploads: 3
max_xlsx_cells: 50000
document_processing_timeout: 120.0
supported_file_types:
  - .txt
  - .md
  - .csv
  - .json
  - .xml
  - .html
  - .xlsx
  - .docx
  - .rtf
  - .pdf

# --- Audit log size ---
audit_log_max_bytes: 10485760    # 10 MB
audit_log_backup_count: 5

# --- Closed-world filtering ---
# THREAT MODEL: This filter only holds when the submission is the FULL
# context the downstream consumer sees. Agent workflows that combine the
# snippet with external knowledge (CRM, email history, model parametric
# knowledge) break the assumption.
# GAMEABLE: Role-based references ("the patient", "the customer", "der Kunde")
# do not trigger the anchor check — quasi-identifiers in such narratives will
# pass through unredacted. Not safe for healthcare, social-services, or any
# context using role-based identification.
# HIPAA: Safe Harbor requires unconditional date removal — do not enable this
# flag in Safe Harbor contexts. See regulatory_scope config for enforcement.
# ART. 9: NRP (nationality, religion, politics) is classified as a
# quasi-identifier under this filter. Operators who enable closed-world
# filtering are responsible for documenting their Art. 9 lawful basis
# separately. Redakt's audit log (closed_world_suppressed_count) does not
# satisfy Art. 9 record-keeping on its own.
# NOTE: Does NOT apply to /api/documents/upload (document pipeline) in v1 —
# see RESEARCH-008 §System Data Flow (fifth call site) for rationale.
# OVERRIDE: Per-request closed_world_filtering field is enabled by default.
# Set allow_per_request_closed_world_override: false to disable per-request
# override at the deployment boundary (see SEC-001a).
closed_world_filtering: false

# Regulatory scope for compliance enforcement gates.
# Include "HIPAA" to prevent enabling closed_world_filtering (Safe Harbor
# requires unconditional date removal — closed-world filter is incompatible).
regulatory_scope: ["GDPR"]

# Operator gate: set to false to prevent callers from using the per-request
# closed_world_filtering override field. The effective value is always the
# instance default above.
allow_per_request_closed_world_override: true

# When true, unrecognized entity types in the lists below raise a startup
# ValidationError instead of only emitting a WARNING log line.
strict_entity_validation: false

# Strong anchors: entity types whose presence confirms a natural person is
# identifiable. When any one of these is detected, quasi-identifier spans
# are retained (not suppressed) even when closed_world_filtering is true.
# MEDICAL_LICENSE note: US DEA-scoped. Known false-positive on DE_MASTR_ID
# substrings. If disabled entirely in Presidio, removing it here is a no-op.
# DE_KFZ note: Trivially traceable to owner via traffic records in DE.
# Operators in jurisdictions where plate look-up is not trivially available
# may remove DE_KFZ from this list (it becomes always-emit).
strong_anchors:
  - PERSON
  - EMAIL_ADDRESS
  - PHONE_NUMBER
  - IBAN_CODE
  - EU_VAT_ID
  - BIC_CODE
  - SEPA_CREDITOR_ID
  - MEDICAL_LICENSE
  - DE_TAX_ID
  - DE_VAT_ID
  - DE_ID_CARD
  - DE_PASSPORT
  - DE_SOCIAL_SECURITY
  - DE_FUEHRERSCHEIN
  - DE_LANR
  - DE_TAX_NUMBER
  - DE_HEALTH_INSURANCE
  - DE_MASTR_ID
  - DE_KFZ

# Quasi-identifiers: entity types that are only re-identifying when joined
# with a strong anchor. Suppressed when closed_world_filtering is true and no
# anchor is present.
# NRP (Art. 9): Operators enabling NRP suppression must document Art. 9
# lawful basis in their GDPR Records of Processing Activities separately.
# Operators who cannot accept this responsibility must remove NRP from this
# list so NRP is always emitted (always-emit behavior).
quasi_identifiers:
  - DATE_TIME
  - LOCATION
  - NRP
  - DE_PLZ
