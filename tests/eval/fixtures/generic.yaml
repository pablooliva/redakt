# Generic / multilingual entities — clear, high-signal PII that should always be detected.

- text: "Please email John Smith at john.smith@example.com about the proposal."
  language: en
  expect: [PERSON, EMAIL_ADDRESS]

- text: "Contact Maria Rodriguez on +1 415 555 0133."
  language: en
  expect: [PERSON, PHONE_NUMBER]

- text: "Send the wire to IBAN GB82 WEST 1234 5698 7654 32."
  language: en
  expect: [IBAN_CODE]

- text: "My card number is 4111 1111 1111 1111, expiring 12/27."
  language: en
  expect: [CREDIT_CARD]

- text: "Server at 192.168.1.42 went down."
  language: en
  expect: [IP_ADDRESS]

- text: "Visit https://internal.acme.example/admin for the dashboard."
  language: en
  expect: [URL]

- text: "MAC address 00:1A:2B:3C:4D:5E"
  language: en
  expect: [MAC_ADDRESS]

- text: "BTC tip address 1BoatSLRHtKNngkdXEeobR76b53LETtpyT"
  language: en
  expect: [CRYPTO]

- text: "Bitte schreiben Sie an Herrn Hans Müller unter hans.mueller@beispiel.de."
  language: de
  expect: [PERSON, EMAIL_ADDRESS]

- text: "Anna Schmidt arbeitet bei der Beispiel AG in Berlin."
  language: de
  expect: [PERSON]
  notes: "Bare city alone isn't PII at the default threshold; we want PERSON detected. ORGANIZATION not currently firing on the spaCy German model."

# === EU_VAT_ID (multi-country) — cross-border B2B coverage ===
# One recognizer, all 27 EU prefixes, registered en+de. The fixtures below
# anchor the per-prefix length constraints and the en/de symmetry; the
# matching country-specific bodies live in the EuVatIdRecognizer regex.
# Closes the gap where only DE-prefixed VAT IDs were detected (the
# country-specific DeVatIdRecognizer is de-only and DE-only).

- text: "Please remit to our Italian supplier; VAT ID IT12345678901."
  language: en
  expect: [EU_VAT_ID]
  notes: "Italian subsidiary on English correspondence — IT 11 digits. DeVatIdRecognizer is de-only, so before EU_VAT_ID this phrase surfaced zero VAT entities."

- text: "Our Dutch entity uses VAT NL123456789B01 on invoices."
  language: en
  expect: [EU_VAT_ID]
  notes: "Netherlands VAT format: 9 digits + literal 'B' + 2 digits."

- text: "Czech supplier VAT CZ12345678 attached to PO."
  language: en
  expect: [EU_VAT_ID]
  notes: "Czechia: 8-digit short form (CZ also allows 9 or 10)."

- text: "French invoice cites VAT FR12345678901 for Q2 reconciliation."
  language: en
  expect: [EU_VAT_ID]
  notes: "France: 2 alphanumeric + 9 digits = 11 chars after FR."

- text: "Polish customer reference: NIP PL1234567890 on order 4711."
  language: en
  expect: [EU_VAT_ID]
  notes: "Poland: 10 digits. 'NIP' is the local-language VAT term and appears in EU_VAT_ID's CONTEXT list."

- text: "Bitte überweisen Sie an unseren österreichischen Lieferanten; USt-IdNr. ATU12345678."
  language: de
  expect: [EU_VAT_ID]
  notes: "Austria on German text — AT VAT IDs are always 'U' + 8 digits. DeVatIdRecognizer requires the DE prefix exactly, so AT-prefix detection only comes from EU_VAT_ID."

- text: "Rechnung enthält die VAT IT12345678901 unseres italienischen Werks."
  language: de
  expect: [EU_VAT_ID]
  notes: "Italian VAT in German invoice text — cross-border invoice flow at a DE HQ."

- text: "Anfrage vom polnischen Partner mit VAT-ID PL1234567890."
  language: de
  expect: [EU_VAT_ID]
  notes: "PL prefix on German text — neighbor country that DeVatIdRecognizer never handled."

- text: "Unsere niederländische Niederlassung nutzt NL123456789B01."
  language: de
  expect: [EU_VAT_ID]
  notes: "Dutch VAT on German text — multi-subsidiary parent-company shape."

- text: "Cross-border invoice for DE123456789 from our UK branch."
  language: en
  expect: [EU_VAT_ID, DE_VAT_ID]
  notes: "DE prefix on ENGLISH text. After DE_* recognizers were registered for both de and en (default_recognizers.yaml), DeVatIdRecognizer and EuVatIdRecognizer both fire on the DE-prefixed span as separate entities (different entity_type, same span, score 0.85 each — the German VAT context boost applies via substring-match on 'VAT' / 'invoice'). Pins the cross-border language symmetry on the DE_* en-registration change."

# === DE_* recognizers registered for `en` — cross-border subsidiary coverage ===
# Memodo's German HQ corresponds in English with its IT/CZ/NL subsidiaries.
# Before this change, English requests yielded zero DE-entity detections;
# the YAML now registers each DE_* recognizer for both `de` and `en`. The
# positives below cover the structurally-confident recognizers (base score
# >= 0.4 or boosted by German loanwords appearing verbatim in en text via
# substring CONTEXT match) — low-base recognizers (DE_PLZ 0.05, DE_KFZ
# 0.2-0.3, DE_HEALTH_INSURANCE 0.3, DE_FUEHRERSCHEIN 0.35) stay context-
# gated because their CONTEXT lists are German-only and the +0.35 boost
# requires the German vocabulary to literally appear in the text.

- text: "For the new contract, our German HQ tax ID is 12345678903."
  language: en
  expect: [DE_TAX_ID]
  notes: "DE_TAX_ID strict pattern (11 digits + ISO 7064 Mod 11,10 checksum) at base 0.5; observed live score is 1.0 (German tax-id context boosts via 'tax id'). Subsidiary staff writing in English to the DE HQ — before en registration this never surfaced. PhoneRecognizer also fires at 0.4 on the 11-digit span; subset-matching tolerates the extra."

- text: "Please reference our Steuer-ID 12345678903 on the cross-border invoice."
  language: en
  expect: [DE_TAX_ID]
  notes: "German loanword 'Steuer-ID' appears verbatim in English correspondence between EU subsidiaries. DE_TAX_ID's German CONTEXT entries substring-match the loanword token, boosting the score."

- text: "His German Personalausweis L01X00T47 was attached to the onboarding form."
  language: en
  expect: [DE_ID_CARD]
  notes: "DE_ID_CARD strict ICAO pattern at 0.4 base + German loanword 'Personalausweis' boosts via substring CONTEXT match -> live score 0.75. Confirms German loanwords in English text still trigger the German context boost (LemmaContextAwareEnhancer does substring match on raw tokens, language-agnostic). DE_PASSPORT relaxed pattern also fires at 0.4 on the same span (same overlap as the de fixture); subset-matching tolerates it."

- text: "The BNetzA assigned MaStR number SEE901234567890 to the rooftop installation."
  language: en
  expect: [DE_MASTR_ID]
  notes: "DE_MASTR_ID at base 0.85 — strongest DE recognizer, equally needed on English correspondence from EU subsidiaries. Companion to the de.yaml MaStR positive; pins language symmetry. Known side-effect on en: MedicalLicenseRecognizer (USA DEA, en-scoped) also fires at 1.0 on the 9-char substring `EE9012345` inside the 15-char MaStR — same substring collision that motivated scoping MEDICAL_LICENSE to en in fork 322eccf. Subset-matching tolerates the extra; follow-up may disable MEDICAL_LICENSE entirely (Memodo has no DEA use case)."

- text: "Order 80331 units of the new inverter and ship 12345 brackets separately."
  language: en
  expect_clean: true
  notes: "DE_PLZ negative on English text. Two bare 5-digit numbers (80331 = real Munich PLZ, 12345 = generic invalid) embedded in English commercial sentences. DE_PLZ base score is 0.05 and its CONTEXT list is German-only (Postleitzahl/Lieferadresse/Bauvorhaben/etc.) — none of those substring-match English tokens here, so the +0.35 boost never applies and 0.05 stays below the 0.35 default threshold. The central safety claim of registering DE_PLZ for en."

- text: "Project M-AB 1234 will be reassigned to the Berlin team next sprint."
  language: en
  expect_clean: true
  notes: "DE_KFZ negative on English text. Pattern `M-AB 1234` matches the bindestrich+leerzeichen KFZ regex (base 0.3) but with no German vehicle context ('Kennzeichen', 'KFZ', 'Auto') the score stays below 0.35. Confirms low-base-score DE_* recognizers remain context-gated under en."

# === EN long-form DATE_TIME patterns (Memodo cross-border item 4) ===
# Four new patterns added to DateRecognizer in fork 184d0e1:
#   Month DD, YYYY   0.95   "March 28, 2026"
#   Mon DD, YYYY     0.85   "Mar 28, 2026" (or "Mar. 28, 2026")
#   DD Month YYYY    0.95   "28 March 2026"
#   Q[1-4] YYYY      0.85   "Q3 2026"
# Only the 0.95 forms surface through Redakt's `DATE_TIME: 0.95` floor end-
# to-end (the floor exists to drop NLP overfire on "today" / "next weekend").
# The 0.85 forms are intentionally below the floor — same shape as the
# `dd.mm.yy at 0.4` ambiguous-with-software-versions pattern — and are
# anchored at the recognizer level by the fork's unit tests
# (test_date_recognizer.py, fork 184d0e1) rather than here. If a future
# Redakt config lowers the DATE_TIME floor, the 0.85 forms will start
# surfacing and these fixtures can be extended with positives for them.

- text: "Hi Sarah, regarding our purchase order PO-44231: the shipment was originally promised by March 28, 2026, can you confirm?"
  language: en
  expect: [PERSON, DATE_TIME]
  notes: "Memodo pilot phrase 07-english-mfg-correspondence (compressed). Anchors the `Month DD, YYYY` 0.95 pattern on canonical English long-form correspondence between the DE HQ and a UK/IE supplier. Without the new pattern, stanford-deidentifier-base's NLP DATE label on 'March 28, 2026' scores below 0.95 and gets filtered by the consumer floor — the regex hit at 0.95 is the only DATE_TIME signal that now survives. PERSON ('Sarah') also surfaces — subset-matching tolerates the multi-PII shape. PO-44231 must NOT fire (internal reference, no recognizer covers it)."

- text: "Order is scheduled for 28 March 2026 delivery from the Hamburg warehouse."
  language: en
  expect: [DATE_TIME]
  notes: "Anchors the `DD Month YYYY` 0.95 pattern — British / European day-first form common on cross-border invoices and shipping notices. Different surface from the comma-separated `Month DD, YYYY` form so both patterns need their own anchor. (LOCATION 'Hamburg' is NOT asserted: stanford-deidentifier-base scores Hamburg below the Redakt LOCATION: 0.90 floor on this short phrase, so the entity does not surface end-to-end. Subset-matching means the test still passes when only DATE_TIME is required.)"

- text: "march 28, 2026 was the original ship date per the previous email."
  language: en
  expect: [DATE_TIME]
  notes: "Case-insensitivity anchor. PatternRecognizer compiles with re.IGNORECASE in its global_regex_flags (presidio fork pattern_recognizer.py:47), so lowercase 'march' must still hit `Month DD, YYYY` at 0.95. Pins that a future Presidio-side change that drops the global IGNORECASE flag (or adds a recognizer-local override) would fail CI here, even though the upper-case fixture above would continue to pass."

- text: "Last batch shipped March 2026 with no follow-up cycles planned."
  language: en
  expect_clean: true
  notes: "Negative anchor for `Month DD, YYYY` — bare month + year without a day MUST NOT match. The new patterns all require a day digit (Month DD, YYYY / DD Month YYYY) or a quarter prefix (Q[1-4] YYYY); a Month+Year-only form is intentionally NOT a pattern (overlaps too heavily with project-status prose like 'planned for January 2027'). stanford-deidentifier-base's DATE NER may flag 'March 2026' but its NLP score lands below the 0.95 floor and gets filtered. If a future recognizer adds a `Month YYYY` pattern at >=0.95 this fixture will fail — that's the intended guardrail."

- text: "Section 32, 2026 of the policy was misquoted in the audit memo."
  language: en
  expect_clean: true
  notes: "Day-range guardrail. Surface looks like `Month DD, YYYY` because of the `, 2026` suffix, but the leading 'Section' is not a month name AND the day '32' is outside the [1-31] character class in the new pattern. Anchors that an invalid day is rejected by the regex even when surrounding shape (comma + 4-digit year) is date-like. Companion guardrail to `March 32, 2026 invalid day` in the fork unit tests."

# === Banking adjuncts (Memodo cross-border item 5) ===
# BIC_CODE and SEPA_CREDITOR_ID registered for en + de. The fork-side
# recognizers wrap their patterns in inline (?-i:...) scoped flag groups
# so the IGNORECASE drop survives Presidio's RecognizerRegistry, which
# overwrites global_regex_flags at YAML load time. Country-code slot
# constrained to ISO 3166-1 alpha-2; documented residual FP surface
# (RECHNUNG / INSTITUT in ALL-CAPS prose) anchored in fork-side unit
# tests rather than here.

- text: "Please wire to BIC CHASUS33, IBAN DE89370400440532013000. Our Creditor Identifier is FR72ZZZ123456."
  language: en
  expect: [BIC_CODE, IBAN_CODE, SEPA_CREDITOR_ID]
  notes: "Cross-border B2B wire instruction — US BIC + DE IBAN + FR Creditor Identifier in a single English sentence. Pins en-language symmetry for both banking adjuncts (the YAML registers them for en + de). SEPA_CREDITOR_ID may also surface a second time on the IBAN span — subset matching tolerates the extra entity. CHASUS33 has digits in the location code (positions 7-8); FR72ZZZ123456 is the minimum-CBC FR form (FR + 2 + ZZZ + 6 alphanumeric NID = 13 chars)."

- text: "Our SWIFT code is BARCGB22XXX for sterling wires from London."
  language: en
  expect: [BIC_CODE]
  notes: "11-char BIC with XXX head-office branch on English text. BARCGB22 is the canonical Barclays / GB BIC shape (positions 5-6 = 'GB'). LOCATION (London) does not surface end-to-end at the Redakt LOCATION: 0.90 floor on this short phrase — subset matching means the test still passes when only BIC_CODE is required."

- text: "Creditor Identifier DE17ZZZ00012345678 was registered with the Bundesbank."
  language: en
  expect: [SEPA_CREDITOR_ID]
  notes: "English text mentioning a DE-prefixed Creditor Identifier — the cross-border case where Memodo's English-speaking IT/CZ/NL subsidiary staff might reference the parent's CI. Anchors en-language registration of SepaCreditorIdRecognizer. 'Creditor Identifier' is in the recognizer's CONTEXT list and boosts to saturation."

- text: "please wire via swift code chasus33 to the new account"
  language: en
  expect_clean: true
  notes: "Lowercase-suppression anchor. Both 'chasus33' (lowercase BIC) and 'swift code' (lowercase context) are present, but the inline (?-i:...) flag drop forces uppercase-only matching on the pattern itself — lowercase 'chasus33' fails [A-Z]{4} at positions 1-4. Pins that a future fork-side change which restores IGNORECASE on these patterns would fail CI here. Equivalent in spirit to the lowercase-Rechnung anchor in de.yaml — both lock the inline flag-drop in place."
