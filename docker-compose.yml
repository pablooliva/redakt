services:
  redakt:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      - REDAKT_BASE_DIR=/app/src/redakt
      - REDAKT_PRESIDIO_ANALYZER_URL=http://presidio-analyzer:5001
      - REDAKT_PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:5001
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy

  presidio-analyzer:
    # SDD-007 REQ-005: built from Dockerfile.multi against the
    # MultiNlpEngine config. English requests run through spaCy
    # `en_core_web_lg`; German requests run through the
    # `xlm-roberta-large-finetuned-conll03-german` transformer.
    build:
      context: ./presidio/presidio-analyzer
      dockerfile: Dockerfile.multi
      args:
        - NLP_CONF_FILE=presidio_analyzer/conf/multi.yaml
    environment:
      - PORT=5001
    healthcheck:
      # REQ-005a Behavior B (connection-refused while engine loads). The
      # Presidio analyzer's Flask server only binds AFTER
      # `MultiNlpEngine.load()` completes for both en and de — until then,
      # `curl` exits non-zero and compose interprets that as "not ready,
      # keep retrying." `start_period` 90s gives ~3x headroom over the
      # 10-30s cold-load expectation in PERF-002 (REQ-014 option (b),
      # 2x safety margin). The `start_period` is the maximum
      # not-yet-healthy window before docker compose declares the
      # container unhealthy; `interval` + `retries` give 20*15s = 5min of
      # post-start_period headroom on a slow-cache cold start.
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  presidio-anonymizer:
    build:
      context: ./presidio/presidio-anonymizer
    environment:
      - PORT=5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
