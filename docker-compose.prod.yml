services:
  redakt:
    image: ghcr.io/pablooliva/redakt:${REDAKT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-c", "import uvicorn; from redakt.log_config import UVICORN_LOG_CONFIG; uvicorn.run('redakt.main:app', host='0.0.0.0', port=8000, workers=2, log_config=UVICORN_LOG_CONFIG)"]
    environment:
      - REDAKT_BASE_DIR=/app/src/redakt
      - REDAKT_PRESIDIO_ANALYZER_URL=http://presidio-analyzer:5001
      - REDAKT_PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:5001
    networks:
      - default
      - caddy_net
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy

  presidio-analyzer:
    # Mirrors docker-compose.yml: Dockerfile.multi + MultiNlpEngine
    # (en spaCy + de transformer). Required for the German PII recall
    # SDD-007 was built to deliver — plain spaCy multilingual misclassifies
    # German common nouns as PERSON.
    image: ghcr.io/pablooliva/redakt-presidio-analyzer:${REDAKT_IMAGE_TAG:-latest}
    build:
      context: ./presidio/presidio-analyzer
      dockerfile: Dockerfile.multi
      args:
        - NLP_CONF_FILE=presidio_analyzer/conf/multi.yaml
    environment:
      - PORT=5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  presidio-anonymizer:
    image: ghcr.io/pablooliva/redakt-presidio-anonymizer:${REDAKT_IMAGE_TAG:-latest}
    build:
      context: ./presidio/presidio-anonymizer
    environment:
      - PORT=5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  caddy_net:
    external: true