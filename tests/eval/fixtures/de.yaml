# Germany-specific country entities. All requests use language=de.

- text: "Meine Steuer-ID lautet 12345678903."
  language: de
  expect: [DE_TAX_ID]
  notes: "Pattern requires 11 contiguous digits and a valid ISO 7064 Mod 11,10 checksum. 12345678903 is the docstring example."

- text: "USt-IdNr.: DE123456789."
  language: de
  expect: [DE_VAT_ID]

- text: "Personalausweis Nummer L01X00T47."
  language: de
  expect: [DE_ID_CARD]

- text: "Postleitzahl 80331 München."
  language: de
  expect: [DE_PLZ]
  notes: "PLZ should be detected; München may also fire as LOCATION at high confidence"

- text: "Lieferadresse: 80331 München"
  language: de
  expect: [DE_PLZ]
  notes: "Anchors the spaCy de_core_news_sm lemma-drift fix (fork f19a6b6). 'Lieferadresse' lemmatizes to 'Lieferadres' (over-stripped -esse), so the DE_PLZ CONTEXT list carries both spellings. A future model swap that re-breaks substring matching on this token must re-add the broken lemma here."

- text: "Hallo, für unser Bauvorhaben in 73230 Kirchheim/Teck benötigen wir ein Angebot."
  language: de
  expect: [DE_PLZ]
  notes: "Anchors the B2B-project-context fix (Memodo pilot phrase 02). 'Bauvorhaben' is the only CONTEXT-eligible token in the prefix window; before fork b3-fix it was not in the DE_PLZ CONTEXT list and no other entry substring-matched it (Bauvorhaben does not contain 'ort'/'straße'/'weg'/etc.), so the +0.35 boost did not apply. Pattern represents the common '<project word> in <PLZ> <City>' shape in installer/GC traffic where no canonical address keyword (Adresse/Postanschrift/PLZ) appears."

- text: "Auf der Baustelle in 70197 Stuttgart fehlen noch zwei Wechselrichter."
  language: de
  expect: [DE_PLZ]
  notes: "Companion to the Bauvorhaben fixture above — same '<project word> in <PLZ> <City>' shape but with 'Baustelle'. Anchors the second new CONTEXT entry."

- text: "Versand voraussichtlich am 15.05.2026."
  language: de
  expect: [DATE_TIME]
  notes: "Anchors the dd.mm.yyyy score bump (fork ee93662). xlm-roberta-large-finetuned-conll03-german has no DATE label, so regex DateRecognizer is the only DATE_TIME signal on German requests. Pre-fix the 0.6 base pattern score was filtered by Redakt's DATE_TIME: 0.95 floor (the floor exists to drop NLP DATE overfire on 'today' / 'next weekend'); the split now scores unambiguous 4-digit-year dotted dates at 0.95 so they pass."

- text: "Stichtag 31.12.2025 für die Anmeldung."
  language: de
  expect: [DATE_TIME]
  notes: "Companion: same dd.mm.yyyy at year-end boundary. Confirms the 4-digit-year regex anchor doesn't depend on a German date keyword (Stichtag is in CONTEXT but the base score already clears the floor on its own)."

- text: "Kfz-Kennzeichen M-AB 1234."
  language: de
  expect: [DE_KFZ]

- text: "Krankenversicherungsnummer A123456787."
  language: de
  expect: [DE_HEALTH_INSURANCE]
  notes: "KVNR has a Mod-10 checksum (GKV spec). A123456787 is the docstring example."

- text: "Reisepassnummer C01X00T47."
  language: de
  expect: [DE_PASSPORT]

- text: "Führerschein Nummer MU12345678B."
  language: de
  expect: [DE_FUEHRERSCHEIN]
  notes: "Pattern is [A-Z]{2}\\d{8}[A-Z0-9] — 2 letters + 8 digits + 1 alphanum."

- text: "MaStR-Nummer SEE901234567890."
  language: de
  expect: [DE_MASTR_ID]
  notes: "BNetzA Marktstammdatenregister: 3-letter object-type prefix + 12 digits. SEE = Stromerzeugungseinheit. Pilot fixture (06-site-visit-with-mastr); also pins the MEDICAL_LICENSE-substring fix (recognizer scoped to en in default_recognizers.yaml)."

# === PV / energy-market identifiers (Memodo cross-border item 3) ===
# Four new German PV-industry recognizers introduced in this commit cycle.
# See presidio-fork ``de_{eeg_anlage,malo,melo,zaehlernummer}_recognizer.py``
# for spec sources (BDEW, VDE-AR-N 4400, MsbG) and the gating rationale
# (which base scores + which CONTEXT words clear which Redakt floors).

- text: "EEG-Anlagenschlüssel E12345678901234567890123456789012 ist hinterlegt."
  language: de
  expect: [DE_EEG_ANLAGE]
  notes: "33-char alphanumeric Anlagenschlüssel (BDEW Beschluss BK6-13-200). Base 0.4 already clears the 0.35 default floor; CONTEXT 'Anlagenschlüssel' adds a +0.35 boost on top. The 33-char width is the structural anchor — DE_EEG_ANLAGE is the looser 33-char [A-Z0-9] pattern (no country prefix required); DE_MELO is the stricter DE-prefixed subset."

- text: "Messlokation DE0001234567890123456789012345678 prüfen."
  language: de
  expect: [DE_MELO, DE_EEG_ANLAGE]
  notes: "VDE-AR-N 4400 MeLo-ID (DE + 31 alphanum = 33 chars). Fires BOTH DE_MELO (specific to DE-prefix) AND DE_EEG_ANLAGE (which the DE-prefixed string is also a member of). The dual-firing is intentional — the consumer's replacement template chooses which entity wins per span; the eval gate just asserts both surface. CONTEXT 'Messlokation' boosts DE_MELO."

- text: "MaLo-ID 12345678907 für Lieferstelle Müller."
  language: de
  expect: [DE_MALO]
  notes: "11-digit Marktlokations-ID with valid BDEW Mod-10 checksum. body 1234567890 weighted [2,1,…] with per-product digit-sum yields sum 43, check digit (10-3)%10 = 7. PatternRecognizer promotes validate_result=True matches to score 1.0, well above any floor. PhoneRecognizer may also fire on the 11-digit substring; the eval gate only asserts DE_MALO is in entities_found."

- text: "Stromzähler 1ESY1160123456 wurde ausgetauscht."
  language: de
  expect: [DE_ZAEHLERNUMMER]
  notes: "Landis+Gyr-style 14-char meter number. Base 0.05 + CONTEXT 'Stromzähler' (+0.35) = 0.40 — just clears the 0.35 default floor. The ≥1-digit lookahead in the pattern is the cheap structural anchor that filters pure-letter German prose ('ausgetauscht', 'Lieferadresse') from context-boosting into matches; without it the same +0.35 boost on a Zähler-context window would mis-flag the verb."

- text: "Lieferadresse: Solarweg 12, 80331 München. Kein PV-Zubehör vorrätig."
  language: de
  expect_clean: false
  expect: [DE_PLZ]
  notes: "Negative anchor for DE_ZAEHLERNUMMER. Real address-block phrasing with PV/Solar vocabulary nearby — earlier base 0.05 without the ≥1-digit lookahead context-boosted pure-letter words ('Lieferadresse', 'ausgetauscht') into DE_ZAEHLERNUMMER hits when a Zähler-context word sat in the window. With the tightened pattern, only DE_PLZ should surface here; no DE_ZAEHLERNUMMER. expect: [DE_PLZ] is the positive assertion; the gate checks the *exact* set so DE_ZAEHLERNUMMER appearing here would fail."

- text: "Anlagenschlüssel"
  language: de
  expect_clean: true
  notes: "Bare common noun. Must not flag DE_EEG_ANLAGE / DE_MELO / DE_ZAEHLERNUMMER on the word alone — the noun is a CONTEXT trigger, not a PII span. Anchors the same broader-class guardrail family as the REQ-009 fixtures below."

- text: "Marktlokation"
  language: de
  expect_clean: true
  notes: "Bare common noun. Must not flag DE_MALO / DE_MELO on the word alone (CONTEXT trigger, not a span)."

# === Banking adjuncts (Memodo cross-border item 5) ===
# BIC_CODE and SEPA_CREDITOR_ID at base 0.85. Both recognizers wrap their
# patterns in (?-i:...) inline scoped flag groups to force uppercase-only
# matching (the registry overwrites global_regex_flags on YAML load, so
# constructor-level overrides do not survive — see fork bic_swift_recognizer.py
# ACCURACY NOTES). The country-code slot in both patterns is restricted to
# the ISO 3166-1 alpha-2 list, which narrows the FP surface against
# common uppercase German words. SEPA_CREDITOR_ID intentionally overlaps
# IBAN_CODE on IBAN-shaped spans >= 15 chars — both fire, IBAN's
# checksum-validated 1.0 wins by score, and the consumer template picks
# per span.

- text: "Bankverbindung: Sparkasse Frankfurt, IBAN DE89370400440532013000, BIC HYVEDEMM."
  language: de
  expect: [IBAN_CODE, BIC_CODE]
  notes: "Canonical DE B2B bank line — IBAN next to BIC. The 8-char all-letter form (HYVEDEMM) is the most common German bank BIC shape; positions 5-6 = 'DE' (Germany), positions 7-8 = 'MM' (alphanumeric location). BIC base 0.85 + CONTEXT 'BIC' / 'IBAN' / 'Bankverbindung' boosts saturate to 1.0. SEPA_CREDITOR_ID may also surface on the IBAN span (DE + 2 digits + 3 alphanum + ...) — subset matching tolerates the extra. Sparkasse Frankfurt may flag as ORG/LOC depending on NLP, also tolerated."

- text: "Bitte überweisen Sie an IBAN DE89 3704 0044 0532 0130 00, BIC: DEUTDEFFXXX."
  language: de
  expect: [IBAN_CODE, BIC_CODE]
  notes: "11-char BIC form with explicit XXX head-office branch — pins the optional 3-char branch alternation in the pattern. Spaced IBAN form (groups of 4) is the user-typed shape; IbanRecognizer's pattern matches across the spaces."

- text: "SEPA-Lastschrift, Gläubiger-ID: DE17ZZZ00012345678, mit Mandatsreferenz."
  language: de
  expect: [SEPA_CREDITOR_ID]
  notes: "Canonical DE Creditor Identifier shape: DE + 2 check digits + ZZZ (no Creditor Business Code used) + 11-digit national identifier = 18 chars total. The token is short enough (< 15 chars... no, 18 chars) to also match IBAN_CODE's pattern, but IBAN's checksum validation rejects this string (the check digits 17 are not a valid ISO 7064 MOD 97-10 over the rest), so only SEPA_CREDITOR_ID surfaces. 'Gläubiger-ID' is in the recognizer's CONTEXT list and boosts the score to saturation."

- text: "Bankverbindung steht im Vertrag."
  language: de
  expect_clean: true
  notes: "Bare common noun negative. 'Bankverbindung' is in the BIC CONTEXT list as a boost trigger, but with no BIC-shaped span in the sentence no recognizer fires. Anchors the same broader-class guardrail family as the bare-Anlagenschlüssel / bare-Marktlokation fixtures above."

- text: "Rechnung Nr. 12345 ist bezahlt."
  language: de
  expect_clean: true
  notes: "Anchors the inline (?-i:...) flag drop. Title-case 'Rechnung' (R uppercase, rest lowercase) would match the bare [A-Z]{4}[A-Z]{2}[A-Z0-9]{2} BIC shape under IGNORECASE, but with the scoped flag drop, positions 2-4 require uppercase and 'echn' (lowercase) fails. Without the (?-i:...) wrapping, every German invoice prose sentence with 'Rechnung' / 'Rechnungen' would FP-flag as BIC_CODE. The 5-digit '12345' is also a bare number — DE_PLZ base 0.05 + no German PLZ-context boost keeps it below the 0.35 floor."

